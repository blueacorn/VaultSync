metadata:
  lastUpdated: 2026-09-29
  purpose: Quick reference for all editable source files with metadata for efficient navigation and change detection
  indexStructure:
    - path: Relative path from project root
    - purpose: File's primary responsibility
    - target: Framework or app target ID
    - classes: Public classes and structs defined
    - protocols: Protocols and extensions
    - keyFunctions: Primary public functions/methods
    - interfaces: Services or protocols this file implements

targets:
  - id: extension
    name: Extension Framework
    description: File Provider implementation (NSFileProviderReplicatedExtension)
    type: framework
    module: Extension.framework

  - id: common
    name: Common Framework
    description: Shared utilities, services, and protocols
    type: framework
    module: Common.framework

  - id: server
    name: Server Framework
    description: Backend service logic (runs in main app, not extension)
    type: framework
    module: Server.framework

  - id: vaultsync
    name: VaultSync App
    description: Main macOS application UI and management
    type: application

  - id: action
    name: File Provider Action Extension
    description: Custom actions UI (NSExtensionFileProviderActions)
    type: extension

  - id: provider
    name: File Provider Entry Point
    description: File Provider extension entry point
    type: extension
    module: Provider.appex

